[project]
name = "ngfw-pqc-detector"
version = "0.1.0"
description = "Next-Generation Firewall with Post-Quantum Cryptography Detection for TLS 1.3"
readme = "README.md"
authors = [{ name = "NGFW Team" }]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "kafka-python>=2.0.2",
    "motor>=3.3.0",
    "pymongo>=4.6.0",
    "scapy>=2.6.0",
    "cryptography>=44.0.0",
    "python-dotenv>=1.0.1",
    "httpx>=0.28.0",
    "pyyaml>=6.0.2",
    # Modern Agent Framework
    "langgraph>=0.2.28",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-anthropic>=0.2.0",
    "langchain-ollama>=0.2.0",
    # Vector Database & Embeddings
    "chromadb>=0.5.0",
    "sentence-transformers>=3.0.0",
    "langchain-chroma>=0.1.0",
    # Observability
    "langsmith>=0.1.0",
    "langfuse>=2.0.0",
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    # Streaming & Real-time
    "sse-starlette>=2.0.0",
    "websockets>=12.0",
    # Distributed State
    "redis>=5.0.0",
    "celery>=5.3.0",
    # Additional Tools
    "tiktoken>=0.7.0",
    "tenacity>=8.2.0",
    "instructor>=1.0.0",
]

[project.optional-dependencies]
dev = ["pre-commit>=4.3.0", "black>=24.10.0", "isort>=5.13.2", "mypy>=1.13.0"]
analyze = ["pylint>=3.3.6", "flake8>=7.1.1"]
test = [
    "pytest>=8.3.5",
    "pytest-asyncio>=0.26.0",
    "pytest-cov>=6.1.1",
    "pytest-html>=4.1.1",
    "pytest-mock>=3.14.0",
]

[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
